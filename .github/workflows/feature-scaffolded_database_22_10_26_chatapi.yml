# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ChatAPI

on:
  push:
    branches:
      - 'feature/scaffolded_database_22_10_26'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # - name: Build with dotnet
      #   run: dotnet build --configuration Release

      # - name: dotnet publish
      #   run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"
      - name: Build Chat API
        run: dotnet build ChatBridge.Chat.API/ChatBridge.Chat.API.csproj --configuration Release

      - name: Publish Chat API
        run: dotnet publish ChatBridge.Chat.API/ChatBridge.Chat.API.csproj --configuration Release --output "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_856B6E4ADBB94DA88797F85B0CBD221A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BB772E5F6FDF4E768AE2FEDEC97B4C78 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EA13B55232DC49DE8BB17FF201AFBACD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ChatAPI'
          slot-name: 'Production'
          package: .
          
